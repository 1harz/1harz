<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-label="Raul Falluh Directives Card">
  <style>
    <![CDATA[
    
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .font-heading {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
  }

  .font-sans {
    font-family: 'Inter', -apple-system, sans-serif;
  }
  
  .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .blink {
    animation: blink 1.1s infinite;
  }

    ]]>
  </style>
  
  <defs>
    <!-- Background Technical Grid Pattern -->
    <pattern id="about-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="0.8"/>
    </pattern>

    <!-- Dark Card Background Gradient -->
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
  </defs>
  

  <!-- Base Container -->
  <rect x="0.5" y="0.5" width="879" height="309" fill="url(#about-bg)" stroke="#222222" stroke-width="1"/>
  <rect x="1" y="43" width="878" height="266" fill="url(#about-grid)"/>

  
    <!-- Top Technical Bar -->
    <rect x="0" y="0" width="880" height="42" fill="#090909"/>
    <line x1="0" y1="42" x2="880" y2="42" stroke="#222222" stroke-width="1"/>

    <!-- Left: Section Index & Title (using tspan so title never collides with index) -->
    <g transform="translate(24, 26)">
      <text y="0">
        <tspan class="font-mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">01</tspan>
        <tspan dx="16" class="font-heading" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.5">CORE DIRECTIVES // DIRETRIZES GERAIS</tspan>
      </text>
    </g>

    <!-- Right: Technical tag -->
    <g transform="translate(856, 26)">
      <text text-anchor="end" class="font-mono" font-size="11" font-weight="500" fill="#777777" letter-spacing="1">
        ENGINEERING_PRINCIPLES
      </text>
    </g>

    <!-- Technical Corner Crosshairs (Top) -->
    <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
    <path d="M 872 16 L 872 8 L 864 8" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
  
  
    <!-- Bottom Technical Corner Crosshairs -->
    <path d="M 8 294 L 8 302 L 16 302" fill="none" stroke="#333333" stroke-width="1.2"/>
    <path d="M 872 294 L 872 302 L 864 302" fill="none" stroke="#333333" stroke-width="1.2"/>
  

  <!-- Intro text: Dedicação e Resiliência destacadas -->
  <g transform="translate(36, 72)">
    <text class="font-mono" font-size="11" font-weight="600" fill="#00e5ff" letter-spacing="1">
      // RESILIÊNCIA, DEDICAÇÃO &amp; PADRÕES DE ENGENHARIA
    </text>
    <text y="24" class="font-sans" font-size="13" font-weight="400" fill="#888888">
      Dedicação incansável e resiliência profissional como motores para superar complexidades técnicas e arquitetar soluções escaláveis.
    </text>
  </g>

  <!-- 3 Tech Directives Columns -->
  <g transform="translate(36, 122)">
    <!-- Column 1: Escalabilidade -->
    <g transform="translate(0, 0)">
      <rect width="256" height="152" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="256" y2="0" stroke="#00e5ff" stroke-width="2"/>

      <text x="18" y="28" class="font-mono" font-size="11" font-weight="700" fill="#00e5ff">#01 // ESCALABILIDADE</text>
      <text x="18" y="52" class="font-heading" font-size="16" font-weight="700" fill="#ffffff">Alta Concorrência</text>

      <text x="18" y="80" class="font-sans" font-size="12" fill="#999999">Estruturação para alto volume.</text>
      <text x="18" y="98" class="font-sans" font-size="12" fill="#999999">Arquitetura em camadas e cache</text>
      <text x="18" y="116" class="font-sans" font-size="12" fill="#999999">com Redis em sistemas críticos.</text>

      <text x="18" y="138" class="font-mono" font-size="9.5" font-weight="600" fill="#555555">[ REDIS // CLUSTERING ]</text>
    </g>

    <!-- Column 2: Clean Code & SOLID -->
    <g transform="translate(276, 0)">
      <rect width="256" height="152" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="256" y2="0" stroke="#00e5ff" stroke-width="2"/>

      <text x="18" y="28" class="font-mono" font-size="11" font-weight="700" fill="#00e5ff">#02 // CLEAN CODE &amp; SOLID</text>
      <text x="18" y="52" class="font-heading" font-size="16" font-weight="700" fill="#ffffff">Manutenibilidade</text>

      <text x="18" y="80" class="font-sans" font-size="12" fill="#999999">Código tipado, limpo e testável.</text>
      <text x="18" y="98" class="font-sans" font-size="12" fill="#999999">Boas práticas que reduzem atrito</text>
      <text x="18" y="116" class="font-sans" font-size="12" fill="#999999">e garantem alta longevidade.</text>

      <text x="18" y="138" class="font-mono" font-size="9.5" font-weight="600" fill="#555555">[ TYPESCRIPT // TESTING ]</text>
    </g>

    <!-- Column 3: AI Integration, Agents & Fine-Tuning -->
    <g transform="translate(552, 0)">
      <rect width="256" height="152" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="256" y2="0" stroke="#00e5ff" stroke-width="2"/>

      <text x="18" y="28" class="font-mono" font-size="11" font-weight="700" fill="#00e5ff">#03 // INTEGRAÇÃO COM IA</text>
      <text x="18" y="52" class="font-heading" font-size="16" font-weight="700" fill="#ffffff">Agentes &amp; Fine-Tuning</text>

      <text x="18" y="80" class="font-sans" font-size="12" fill="#999999">Aprofundamento prático em</text>
      <text x="18" y="98" class="font-sans" font-size="12" fill="#999999">desenvolvimento e fine-tuning</text>
      <text x="18" y="116" class="font-sans" font-size="12" fill="#999999">de Agentes de IA autônomos.</text>

      <text x="18" y="138" class="font-mono" font-size="9.5" font-weight="600" fill="#555555">[ AGENTES // FINE-TUNING ]</text>
    </g>
  </g>
</svg>