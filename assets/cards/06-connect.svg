<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Raul Falluh Contact Card">
  <style>
    <![CDATA[
    
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .font-heading {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
  }

  .font-sans {
    font-family: 'Inter', -apple-system, sans-serif;
  }
  
  .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .blink {
    animation: blink 1.1s infinite;
  }

    ]]>
  </style>
  
  <defs>
    <!-- Background Technical Grid Pattern -->
    <pattern id="connect-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="0.8"/>
    </pattern>

    <!-- Dark Card Background Gradient -->
    <linearGradient id="connect-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
  </defs>
  

  <rect x="0.5" y="0.5" width="879" height="259" fill="url(#connect-bg)" stroke="#222222" stroke-width="1"/>
  <rect x="1" y="43" width="878" height="216" fill="url(#connect-grid)"/>

  
    <!-- Top Technical Bar -->
    <rect x="0" y="0" width="880" height="42" fill="#090909"/>
    <line x1="0" y1="42" x2="880" y2="42" stroke="#222222" stroke-width="1"/>

    <!-- Left: Section Index & Title (using tspan so title never collides with index) -->
    <g transform="translate(24, 26)">
      <text y="0">
        <tspan class="font-mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">05</tspan>
        <tspan dx="16" class="font-heading" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.5">CONTATO // DISPONIBILIDADE</tspan>
      </text>
    </g>

    <!-- Right: Technical tag -->
    <g transform="translate(856, 26)">
      <text text-anchor="end" class="font-mono" font-size="11" font-weight="500" fill="#777777" letter-spacing="1">
        // CONNECT
      </text>
    </g>

    <!-- Technical Corner Crosshairs (Top) -->
    <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
    <path d="M 872 16 L 872 8 L 864 8" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
  
  
    <!-- Bottom Technical Corner Crosshairs -->
    <path d="M 8 244 L 8 252 L 16 252" fill="none" stroke="#333333" stroke-width="1.2"/>
    <path d="M 872 244 L 872 252 L 864 252" fill="none" stroke="#333333" stroke-width="1.2"/>
  

  <!-- Left Side: Title & Invitation (width max 410px) -->
  <g transform="translate(36, 75)">
    <text class="font-mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1.5">
      // VAMOS CONSTRUIR ALGO EXTRAORDINÁRIO?
    </text>
    <text y="38" class="font-heading" font-size="34" font-weight="700" fill="#ffffff">
      CONTATO
    </text>
    <text y="70" class="font-sans" font-size="13" fill="#888888">
      Aberto para novos desafios de engenharia, sistemas de alta
    </text>
    <text y="90" class="font-sans" font-size="13" fill="#888888">
      concorrência e projetos inovadores com IA.
    </text>

    <g transform="translate(0, 115)">
      <rect width="180" height="34" fill="#0a0a0a" stroke="#00e5ff" stroke-width="1"/>
      <text x="18" y="22" class="font-mono" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">
        PORTFOLIO: 1HARZ.COM ↗
      </text>
    </g>
  </g>

  <!-- Right Side: Contact Details (Starts at x=480, completely separate from left) -->
  <g transform="translate(480, 72)">
    <!-- WhatsApp -->
    <g transform="translate(0, 0)">
      <text class="font-mono" font-size="10" font-weight="700" fill="#00e5ff" letter-spacing="1.5">WHATSAPP</text>
      <text y="24" class="font-mono" font-size="15" font-weight="600" fill="#ffffff">+55 61 98407-8564 ↗</text>
      <line x1="0" y1="34" x2="360" y2="34" stroke="#1c1c1c" stroke-width="1"/>
    </g>

    <!-- Email -->
    <g transform="translate(0, 52)">
      <text class="font-mono" font-size="10" font-weight="700" fill="#00e5ff" letter-spacing="1.5">EMAIL</text>
      <text y="24" class="font-mono" font-size="15" font-weight="600" fill="#ffffff">raulfalluh@gmail.com ↗</text>
      <line x1="0" y1="34" x2="360" y2="34" stroke="#1c1c1c" stroke-width="1"/>
    </g>

    <!-- LinkedIn & Location -->
    <g transform="translate(0, 104)">
      <g>
        <text class="font-mono" font-size="10" font-weight="700" fill="#00e5ff" letter-spacing="1.5">LINKEDIN</text>
        <text y="24" class="font-mono" font-size="14" font-weight="600" fill="#ffffff">/in/raulfalluh ↗</text>
      </g>
      <g transform="translate(190, 0)">
        <text class="font-mono" font-size="10" font-weight="700" fill="#00e5ff" letter-spacing="1.5">LOCALIZAÇÃO</text>
        <text y="24" class="font-mono" font-size="13" font-weight="500" fill="#cccccc">Brasília, DF // Brasil</text>
      </g>
      <line x1="0" y1="34" x2="360" y2="34" stroke="#1c1c1c" stroke-width="1"/>
    </g>
  </g>
</svg>