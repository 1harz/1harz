<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Raul Falluh GitHub Stats Card">
  <style>
    <![CDATA[
    
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .font-heading {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
  }

  .font-sans {
    font-family: 'Inter', -apple-system, sans-serif;
  }
  
  .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .blink {
    animation: blink 1.1s infinite;
  }

    ]]>
  </style>
  
  <defs>
    <!-- Background Technical Grid Pattern -->
    <pattern id="stats-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="0.8"/>
    </pattern>

    <!-- Dark Card Background Gradient -->
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
  </defs>
  

  <rect x="0.5" y="0.5" width="879" height="229" fill="url(#stats-bg)" stroke="#222222" stroke-width="1"/>
  <rect x="1" y="43" width="878" height="186" fill="url(#stats-grid)"/>

  
    <!-- Top Technical Bar -->
    <rect x="0" y="0" width="880" height="42" fill="#090909"/>
    <line x1="0" y1="42" x2="880" y2="42" stroke="#222222" stroke-width="1"/>

    <!-- Left: Section Index & Title (using tspan so title never collides with index) -->
    <g transform="translate(24, 26)">
      <text y="0">
        <tspan class="font-mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1">04</tspan>
        <tspan dx="16" class="font-heading" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.5">GITHUB METRICS // PERFORMANCE</tspan>
      </text>
    </g>

    <!-- Right: Technical tag -->
    <g transform="translate(856, 26)">
      <text text-anchor="end" class="font-mono" font-size="11" font-weight="500" fill="#777777" letter-spacing="1">
        @1HARZ
      </text>
    </g>

    <!-- Technical Corner Crosshairs (Top) -->
    <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
    <path d="M 872 16 L 872 8 L 864 8" fill="none" stroke="#00e5ff" stroke-width="1.2"/>
  
  
    <!-- Bottom Technical Corner Crosshairs -->
    <path d="M 8 214 L 8 222 L 16 222" fill="none" stroke="#333333" stroke-width="1.2"/>
    <path d="M 872 214 L 872 222 L 864 222" fill="none" stroke="#333333" stroke-width="1.2"/>
  

  <!-- 4 Metric Boxes -->
  <g transform="translate(36, 68)">
    <!-- Box 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="135" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="190" y2="0" stroke="#00e5ff" stroke-width="2"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="700" fill="#777777">CONTRIBUTIONS</text>
      <text x="16" y="70" class="font-heading" font-size="34" font-weight="700" fill="#ffffff">1,600+</text>
      <text x="16" y="94" class="font-sans" font-size="12" fill="#888888">Total Contribuições</text>
      <text x="16" y="118" class="font-mono" font-size="9.5" fill="#00e5ff">▲ CONSTANT GROWTH</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(206, 0)">
      <rect width="190" height="135" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="190" y2="0" stroke="#00e5ff" stroke-width="2"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="700" fill="#777777">CODE DISCIPLINE</text>
      <text x="16" y="70" class="font-heading" font-size="34" font-weight="700" fill="#ffffff">A+</text>
      <text x="16" y="94" class="font-sans" font-size="12" fill="#888888">Padrão de Arquitetura</text>
      <text x="16" y="118" class="font-mono" font-size="9.5" fill="#00e5ff">★ DEDICAÇÃO &amp; RESILIÊNCIA</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(412, 0)">
      <rect width="190" height="135" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="190" y2="0" stroke="#00e5ff" stroke-width="2"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="700" fill="#777777">CORE LANGUAGE</text>
      <text x="16" y="68" class="font-heading" font-size="26" font-weight="700" fill="#ffffff">TypeScript</text>
      <text x="16" y="94" class="font-sans" font-size="12" fill="#888888">Type-Safety Completa</text>
      <text x="16" y="118" class="font-mono" font-size="9.5" fill="#00e5ff">● 95%+ TYPED</text>
    </g>

    <!-- Box 4 -->
    <g transform="translate(618, 0)">
      <rect width="190" height="135" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
      <line x1="0" y1="0" x2="190" y2="0" stroke="#00e5ff" stroke-width="2"/>
      <text x="16" y="26" class="font-mono" font-size="10.5" font-weight="700" fill="#777777">DOMAIN</text>
      <text x="16" y="68" class="font-heading" font-size="26" font-weight="700" fill="#ffffff">Full Stack</text>
      <text x="16" y="94" class="font-sans" font-size="12" fill="#888888">ERP/TMS &amp; AI Agents</text>
      <text x="16" y="118" class="font-mono" font-size="9.5" fill="#00e5ff">⚡ PRODUCTION READY</text>
    </g>
  </g>
</svg>